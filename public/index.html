<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微软邮箱快捷取件令牌批量管理系统</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
}
body {
  background: #0a101f;
  color: #e6edf7;
  line-height: 1.6;
}

/* 顶部导航 */
.header {
  background: linear-gradient(90deg, #111833, #1e295a);
  padding: 0 28px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 0 20px rgba(0, 140, 255, 0.2);
  position: sticky;
  top: 0;
  z-index: 999;
  border-bottom: 1px solid rgba(30, 144, 255, 0.2);
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header h1 i {
  color: #00aaff;
}
.nav {
  display: flex;
  gap: 10px;
}
.nav a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 22px;
  color: rgba(255,255,255,0.9);
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  transition: all 0.25s ease;
  white-space: nowrap;
  border: 1px solid transparent;
}
.nav a:hover,
.nav a.active {
  background: rgba(0, 150, 255, 0.15);
  border-color: rgba(0, 170, 255, 0.4);
  color: #00aaff;
  box-shadow: 0 0 10px rgba(0,150,255,0.2);
}
.nav a.btn-high {
  background: linear-gradient(90deg, #00aaff, #0088ff);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  padding: 14px 26px;
  border-radius: 10px;
  box-shadow: 0 4px 12px rgba(0,170,255,0.3);
}
.nav a.btn-high:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,170,255,0.45);
  color: #fff;
}
.nav a i {
  width: 14px;
  text-align: center;
}

/* 布局 */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 20px;
}
.page-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 24px;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-title i {
  color: #00aaff;
}

/* 卡片 */
.card {
  background: rgba(20, 28, 48, 0.8);
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  border: 1px solid rgba(30, 144, 255, 0.15);
  padding: 28px;
  margin-bottom: 28px;
  backdrop-filter: blur(10px);
}
.card-title {
  font-size: 18px;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(30, 144, 255, 0.2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title i {
  color: #00aaff;
}

/* 按钮 */
button {
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  border: 1px solid transparent;
}
.btn-primary {
  background: linear-gradient(90deg, #0088ff, #00aaff);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0,140,255,0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,140,255,0.45);
}
.btn-danger {
  background: linear-gradient(90deg, #ff3366, #ff5577);
  color: #fff;
  box-shadow: 0 4px 12px rgba(255,50,100,0.3);
}
.btn-danger:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(255,50,100,0.45);
}
.btn-default {
  background: rgba(30, 42, 70, 0.8);
  color: #e6edf7;
  border-color: rgba(30, 144, 255, 0.2);
}
.btn-default:hover {
  background: rgba(40, 54, 86, 0.9);
  border-color: rgba(0,170,255,0.4);
  color: #00aaff;
  transform: translateY(-2px);
}

/* 输入框 */
input, select {
  padding: 12px 16px;
  border: 1px solid rgba(30, 144, 255, 0.25);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  min-width: 170px;
  transition: 0.25s;
  background: rgba(15,22,38,0.8);
  color: #ffffff;
}
input::placeholder {
  color: rgba(255,255,255,0.4);
}
input:focus, select:focus {
  border-color: #00aaff;
  box-shadow: 0 0 0 3px rgba(0,150,255,0.15);
  background: rgba(10,16,30,0.9);
}

/* 上传 */
.upload-box {
  border: 2px dashed rgba(0,150,255,0.3);
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: 0.25s;
  margin-bottom: 20px;
  background: rgba(15,22,38,0.6);
}
.upload-box:hover {
  border-color: #00aaff;
  background: rgba(20,30,55,0.7);
}
.upload-box i {
  font-size: 36px;
  color: #00aaff;
  margin-bottom: 12px;
}
#file-input {
  display: none;
}

/* 进度条 */
.progress-container {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  margin: 12px 0;
  display: none;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00aaff, #0088ff);
  border-radius: 4px;
  transition: width 0.3s ease;
}

/* 表格核心修复：超长内容自动隐藏，不挤压按钮 */
.table-container {
  overflow-x: auto;
  margin-top: 20px;
  border-radius: 12px;
  border: 1px solid rgba(30, 144, 255, 0.15);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  table-layout: fixed;
}
th {
  background: rgba(20, 28, 48, 0.9);
  padding: 16px 14px;
  text-align: left;
  font-weight: 600;
  color: #ffffff;
  border-bottom: 1px solid rgba(30, 144, 255, 0.2);
  white-space: nowrap;
}
td {
  padding: 14px;
  border-bottom: 1px solid rgba(30, 42, 70, 0.5);
  color: #e6edf7;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  vertical-align: middle;
}
tr:hover {
  background: rgba(25, 35, 60, 0.6);
}

/* 列宽分配 */
th:nth-child(1), td:nth-child(1) { width: 50px; }
th:nth-child(2), td:nth-child(2) { width: 220px; }
th:nth-child(3), td:nth-child(3) { width: 120px; }
th:nth-child(4), td:nth-child(4) { width: 110px; }
th:nth-child(5), td:nth-child(5) { width: 120px; }
th:nth-child(6), td:nth-child(6) { width: 160px; }
th:nth-child(7), td:nth-child(7) { width: 180px; }
th:nth-child(8), td:nth-child(8) { width: 380px; white-space: normal; }

/* 弹窗 */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.65);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-content {
  background: #141c30;
  width: 90%;
  max-width: 560px;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  border: 1px solid rgba(0,150,255,0.2);
}
.modal-title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 16px;
  color: #ffffff;
}
.modal-message {
  margin-bottom: 24px;
  color: #b0c4de;
}

/* 加载动画 */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(10,16,30,0.8);
  z-index: 99999;
  align-items: center;
  justify-content: center;
}
.loading-spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(0,150,255,0.2);
  border-top: 3px solid #00aaff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 工具类 */
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.mt-16 { margin-top: 16px; }
.mb-16 { margin-bottom: 16px; }
.align-center { align-items: center; }
.justify-between { justify-content: space-between; }
.no-data {
  text-align: center;
  padding: 60px 0;
  color: rgba(255,255,255,0.3);
  font-size: 15px;
}
.pagination {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
.pagination button {
  min-width: 40px;
  height: 40px;
  padding: 0;
  font-size: 14px;
  border-radius: 8px;
}
.pagination button.active {
  background: #0088ff;
  color: white;
  box-shadow: 0 0 10px rgba(0,140,255,0.3);
}
.content-section { display: none; }
.content-section.active { display: block; }
.password-text { user-select: none; }

@media (max-width: 768px) {
  .header {
    height: auto;
    padding: 16px;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }
  .nav { flex-wrap: wrap; width: 100%; }
  .nav a { flex: 1; justify-content: center; padding: 10px 12px; }
  .container { padding: 20px 12px; }
  .flex { flex-wrap: wrap; }
  .card { padding: 20px; }
}

<script>
const ENCRYPT_KEY = 'xh_email_system_2024';
let mailData = [], originalMailData = [], currentMailPage = 1;
let searchKeyword = '', mailSearchKeyword = '', passwordVisible = false;
let confirmCallback = null, currentGroupFilter = 'all';
let currentPage = 1, itemsPerPage = 5;

// 分组
function getGroups() {
  try {
    const d = CryptoJS.AES.decrypt(localStorage.getItem('emailGroups') || '', ENCRYPT_KEY).toString(CryptoJS.enc.Utf8);
    return d && JSON.parse(d) || ['默认分组'];
  } catch (e) { return ['默认分组']; }
}
function saveGroups(g) {
  localStorage.setItem('emailGroups', CryptoJS.AES.encrypt(JSON.stringify(g), ENCRYPT_KEY).toString());
  updateGroupSelectors();
}
function updateGroupSelectors() {
  const g = getGroups();
  [['group-filter', 'all'], ['batch-group-select', ''], ['edit-group', null]].forEach(([id, d]) => {
    const s = document.getElementById(id);
    if (!s) return;
    const v = s.value;
    s.innerHTML = '';
    if (d !== null) {
      const o = document.createElement('option');
      o.value = d;
      o.textContent = d === 'all' ? '全部分组' : '选择目标分组';
      s.appendChild(o);
    }
    g.forEach(x => {
      const o = document.createElement('option');
      o.value = x;
      o.textContent = x;
      s.appendChild(o);
    });
    if (v) s.value = v;
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initNavLinks();
  initSelectAll();
  initDragUpload();
  initSearchEnter();
  initGroups();
  loadData();
});

function showLoading() { document.getElementById('loading-overlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

// 表格渲染
function loadData() {
  let data = [];
  try {
    const d = localStorage.getItem('emailData');
    if (d) data = JSON.parse(CryptoJS.AES.decrypt(d, ENCRYPT_KEY).toString(CryptoJS.enc.Utf8));
  } catch (e) {}
  data = data.map(x => ({ group: x.group || '默认分组', remark: x.remark || '', ...x }));
  let f = data;
  if (currentGroupFilter !== 'all') f = f.filter(x => x.group === currentGroupFilter);
  if (searchKeyword) f = f.filter(x => x.email.toLowerCase().includes(searchKeyword) || x.remark.toLowerCase().includes(searchKeyword));
  renderTable(f);
  renderPagination(f.length);
  document.getElementById('no-data').style.display = f.length ? 'none' : 'block';
  updateDashboard(data);
}

function renderTable(d) {
  const b = document.querySelector('#emails table tbody');
  b.innerHTML = '';
  const s = (currentPage - 1) * itemsPerPage, e = s + itemsPerPage;
  d.slice(s, e).forEach((item, idx) => {
    const r = document.createElement('tr');
    const c = document.createElement('td');
    const ch = document.createElement('input');
    ch.type = 'checkbox';
    ch.dataset.email = item.email;
    c.appendChild(ch);
    r.appendChild(c);

    const emailTd = document.createElement('td');
    emailTd.textContent = item.email;
    r.appendChild(emailTd);

    const pTd = document.createElement('td');

    sp.textContent = passwordVisible ? item.password : '••••••••';
    pTd.appendChild(sp);
    r.appendChild(pTd);

    const gTd = document.createElement('td');
    gTd.textContent = item.group;
    r.appendChild(gTd);

    const reTd = document.createElement('td');
    reTd.textContent = item.remark || '无';
    r.appendChild(reTd);

    const cidTd = document.createElement('td');
    cidTd.textContent = item.clientId;
    r.appendChild(cidTd);

    const rtTd = document.createElement('td');
    rtTd.textContent = item.refreshToken;
    r.appendChild(rtTd);

    const aTd = document.createElement('td');
    aTd.innerHTML = `
      <button class="btn-default" onclick="viewInbox(${s + idx})">收件箱</button>
      <button class="btn-default" onclick="viewJunk(${s + idx})">垃圾箱</button>
      <button class="btn-primary" onclick="editEmail(${s + idx})">编辑</button>
      <button class="btn-danger" onclick="showDeleteConfirm(${s + idx})">删除</button>
    `;
    r.appendChild(aTd);
    b.appendChild(r);
  });
}

function updateSelectedItems() {

// 批量删除
function batchDelete() {
  const arr = updateSelectedItems();
  if (arr.length === 0) return showModal('提示', '请选择要删除的项！');
  showConfirmModal('确认批量删除', `确定删除选中 ${arr.length} 项？`, () => {
    let d = [];
    try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
    d = d.filter(x => !arr.includes(x.email));
    localStorage.setItem('emailData', CryptoJS.AES.encrypt(JSON.stringify(d), ENCRYPT_KEY).toString());
    loadData();
    showModal('成功', '删除完成');
  });
}
function deleteAllEmails() {
  showConfirmModal('警告', '将删除所有数据，不可恢复！', () => {
    localStorage.removeItem('emailData');
    loadData();
    showModal('成功', '已清空全部');

}

// 分页
function renderPagination(t) {
  const p = document.getElementById('pagination');
  p.innerHTML = '';
  const tp = Math.ceil(t / itemsPerPage);
  if (tp <= 1) return;
  for (let i = 1; i <= tp; i++) {
    const b = document.createElement('button');
    b.textContent = i;
    if (i === currentPage) b.classList.add('active');
    b.onclick = () => { currentPage = i; loadData(); };
    p.appendChild(b);
  }
}
function changeItemsPerPage(v) {
  itemsPerPage = parseInt(v);
  currentPage = 1;
  loadData();
}

// 查看邮件
function viewInbox(i) { loadMail(i, 'INBOX'); }
function viewJunk(i) { loadMail(i, 'Junk'); }
function loadMail(i, box) {
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) { return; }
  let f = d;
  if (currentGroupFilter !== 'all') f = f.filter(x => x.group === currentGroupFilter);
  if (searchKeyword) f = f.filter(x => x.email.includes(searchKeyword) || x.remark.includes(searchKeyword));
  const item = f[i];
  if (!item) return;
  showLoading();
  fetch(`/api/mail-all?refresh_token=${item.refreshToken}&client_id=${item.clientId}&mailbox=${box}`)
    .then(r => r.json())
    .then(data => {
      mailData = data;
      originalMailData = [...data];
      document.querySelectorAll('.content-section').forEach(x => x.classList.remove('active'));
      document.getElementById('mail-list').classList.add('active');
      renderMailTable(data);
    })
    .catch(() => showModal('错误', '加载邮件失败'))
    .finally(() => hideLoading());
}
function renderMailTable(d) {
  const b = document.querySelector('#mail-list table tbody');
  b.innerHTML = '';
  document.getElementById('no-data-mail').style.display = d.length ? 'none' : 'block';
  d.slice((currentMailPage - 1) * 10, currentMailPage * 10).forEach((x, i) => {
    const r = document.createElement('tr');
    r.innerHTML = `<td>${x.send}</td><td>${x.subject}</td><td>${x.date}</td><td><button class="btn-primary" onclick="viewMail(${i})">查看</button></td>`;
    b.appendChild(r);
  });
}
function viewMail(i) {
  const m = originalMailData[i];
  document.getElementById('mail-modal-title').textContent = m.subject;
  document.getElementById('mail-modal-sender').textContent = '发件人：' + m.send;
  document.getElementById('mail-modal-subject').textContent = '主题：' + m.subject;
  document.getElementById('mail-modal-date').textContent = '日期：' + m.date;
  document.getElementById('mail-modal-content').innerHTML = m.html || m.text;
  document.getElementById('mail-modal').style.display = 'flex';
}
function closeMailModal() { document.getElementById('mail-modal').style.display = 'none'; }

// 删除单条
function showDeleteConfirm(i) {
  confirmCallback = () => deleteEmail(i);
  document.getElementById('confirm-message').textContent = '确定删除该邮箱？';
  document.getElementById('confirm-modal').style.display = 'flex';
}
function deleteEmail(i) {
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
  let f = d;
  if (currentGroupFilter !== 'all') f = f.filter(x => x.group === currentGroupFilter);
  if (searchKeyword) f = f.filter(x => x.email.includes(searchKeyword));
  const item = f[i];
  if (!item) return;
  d = d.filter(x => x.email !== item.email);
  localStorage.setItem('emailData', CryptoJS.AES.encrypt(JSON.stringify(d), ENCRYPT_KEY).toString());
  loadData();
  closeConfirmModal();
  showModal('成功', '删除成功');
}

// ==============================================
// 【分批导入 + 进度条 —— 绝对不卡死】
// ==============================================
async function importEmails() {
  const sep = document.getElementById('delimiter').value.trim();
  const file = document.getElementById('file-input').files[0];
  if (!sep || !file) return showModal('错误', '请输入分隔符并选择文件！');

  const progressContainer = document.getElementById('progress-container');
  const progressBar = document.getElementById('progress-bar');
  progressContainer.style.display = 'block';
  progressBar.style.width = '0%';

  const reader = new FileReader();
  reader.onload = async (e) => {
    const lines = e.target.result.split('\n').map(x => x.trim()).filter(Boolean);
    const total = lines.length;
    let processed = 0;
    const batchSize = 50;

    let data = [];
    try {
      const d = localStorage.getItem('emailData');
      if (d) data = JSON.parse(CryptoJS.AES.decrypt(d, ENCRYPT_KEY).toString(CryptoJS.enc.Utf8));
    } catch (e) {}

    const emailSet = new Set(data.map(x => x.email.toLowerCase()));
    const newItems = [];
    let ok = 0, dup = 0, err = 0;

    for (let i = 0; i < lines.length; i += batchSize) {
      const batch = lines.slice(i, i + batchSize);

      for (const line of batch) {
        const arr = line.split(sep).map(x => x.trim());
        if (arr.length >= 4) {
          const em = arr[0], pw = arr[1], cid = arr[2], rt = arr[3];
          if (em && pw && cid && rt) {
            if (emailSet.has(em.toLowerCase())) {
              dup++;
            } else {
              ok++;
              emailSet.add(em.toLowerCase());
              newItems.push({ email: em, password: pw, clientId: cid, refreshToken: rt, group: '默认分组', remark: '' });
            }
          }
        } else {
          err++;
        }
        processed++;
        progressBar.style.width = (processed / total * 100).toFixed(1) + '%';
      }

      await new Promise(r => setTimeout(r, 10));
    }

    data.push(...newItems);
    localStorage.setItem('emailData', CryptoJS.AES.encrypt(JSON.stringify(data), ENCRYPT_KEY).toString());

    progressBar.style.width = '100%';
    setTimeout(() => {
      progressContainer.style.display = 'none';
      loadData();
      showModal('导入完成', `成功：${ok} 条 | 重复：${dup} 条 | 错误：${err} 条`);
    }, 500);
  };
  reader.readAsText(file);
}

// 拖拽上传
function initDragUpload() {
  const u = document.getElementById('upload-box');
  const f = document.getElementById('file-input');
  const i = document.getElementById('file-info');
  u.onclick = () => f.click();
  f.onchange = () => i.textContent = '已选择：' + f.files[0].name;

function showModal(t, m) {

// 编辑
function editEmail(i) {
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
  let f = d;
  if (currentGroupFilter !== 'all') f = f.filter(x => x.group === currentGroupFilter);
  if (searchKeyword) f = f.filter(x => x.email.includes(searchKeyword));
  const item = f[i];
  if (!item) return;
  document.getElementById('edit-email-original').value = item.email;
  document.getElementById('edit-email').value = item.email;
  document.getElementById('edit-password').value = item.password;
  document.getElementById('edit-client-id').value = item.clientId;
  document.getElementById('edit-refresh-token').value = item.refreshToken;
  document.getElementById('edit-remark').value = item.remark;
  updateGroupSelectors();
  document.getElementById('edit-group').value = item.group || '默认分组';
  document.getElementById('edit-modal').style.display = 'flex';
}
function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }
function saveEdit() {
  const e = document.getElementById('edit-email-original').value;
  const p = document.getElementById('edit-password').value;
  const cid = document.getElementById('edit-client-id').value;
  const rt = document.getElementById('edit-refresh-token').value;
  const g = document.getElementById('edit-group').value;
  const r = document.getElementById('edit-remark').value;
  if (!p || !cid || !rt) return showModal('错误', '信息不能为空');
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
  const idx = d.findIndex(x => x.email === e);
  if (idx === -1) return;
  d[idx] = { ...d[idx], password: p, clientId: cid, refreshToken: rt, group: g, remark: r };
  localStorage.setItem('emailData', CryptoJS.AES.encrypt(JSON.stringify(d), ENCRYPT_KEY).toString());
  loadData();
  closeEditModal();
  showModal('成功', '保存成功');
}

// 导出
function exportData() {
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
  if (!d.length) return showModal('提示', '无数据可导出');
  const t = d.map(x => `${x.email}----${x.password}----${x.group}----${x.remark}----${x.clientId}----${x.refreshToken}`).join('\n');
  const blob = new Blob([t], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'emails.txt';
  a.click();
  URL.revokeObjectURL(url);
  showModal('成功', '导出完成');
}

}

// 分组
function createGroup() {
  const n = document.getElementById('new-group').value.trim();
  if (!n) return showModal('错误', '请输入分组名称');
  const g = getGroups();
  if (g.includes(n)) return showModal('错误', '分组已存在');
  g.push(n);
  saveGroups(g);
  document.getElementById('new-group').value = '';
  showModal('成功', '创建成功');
}
function deleteSelectedGroup() {
  const g = document.getElementById('group-filter').value;
  if (g === 'all' || g === '默认分组') return showModal('错误', '无法删除该分组');
  const list = getGroups().filter(x => x !== g);
  saveGroups(list);
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
  d.forEach(x => { if (x.group === g) x.group = '默认分组'; });
  localStorage.setItem('emailData', CryptoJS.AES.encrypt(JSON.stringify(d), ENCRYPT_KEY).toString());
  loadData();
  showModal('成功', '删除成功');
}
function filterByGroup() {
  currentGroupFilter = document.getElementById('group-filter').value;
  currentPage = 1;
  loadData();
}

// 批量分组
function showBatchGroupConfirm() {
  const arr = updateSelectedItems();
  if (arr.length === 0) return showModal('提示', '请选择数据');
  const t = document.getElementById('batch-group-select').value;
  if (!t) return showModal('错误', '请选择目标分组');
  document.getElementById('selected-count').textContent = arr.length;
  document.getElementById('target-group-name').textContent = t;
  document.getElementById('batch-group-modal').style.display = 'flex';
}
function confirmBatchGroup() {
  const arr = updateSelectedItems();
  const t = document.getElementById('batch-group-select').value;
  let d = [];
  try { d = JSON.parse(CryptoJS.AES.decrypt(localStorage.getItem('emailData'), ENCRYPT_KEY).toString(CryptoJS.enc.Utf8)); } catch (e) {}
  d.forEach(x => { if (arr.includes(x.email)) x.group = t; });
  localStorage.setItem('emailData', CryptoJS.AES.encrypt(JSON.stringify(d), ENCRYPT_KEY).toString());
  loadData();
  closeBatchGroupModal();
  showModal('成功', '批量修改完成');
}
function closeBatchGroupModal() { document.getElementById('batch-group-modal').style.display = 'none'; }
